version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      # Use .env file for local development, secrets for CI/CD
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-only-insecure-key-do-not-use-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=${DATABASE_URL:-sqlite:///db.sqlite3}
    command: python manage.py runserver 0.0.0.0:8000