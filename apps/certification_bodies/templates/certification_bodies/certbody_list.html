{% extends "base.html" %}

{% block title %}Certification Body List{% endblock %}

{% block header %}Certification Body List{% endblock %}

{% block content %}
<h2>Certification Bodies</h2>
<ul>
    {% for cert_body in cert_bodies %}
        <li><a href="{% url 'certbody_detail' cb_id=cert_body.id %}">{{ cert_body.name }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
