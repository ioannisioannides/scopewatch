[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = scopewatch.test_settings
python_files = tests.py test_*.py *_tests.py

# Display settings
addopts =
    --verbose
    --color=yes
    --no-header
    --showlocals
    --strict-markers
    --tb=short
    --cov=apps
    --cov-report=term
    --cov-report=html
    -W ignore::DeprecationWarning
    --no-cov-on-fail

# Code formatting and linting
# Run with: pytest --black --flake8 --isort
black =
    --check
    --line-length=88
flake8-max-line-length = 88
flake8-ignore =
    E203
    W503
    E501
isort =
    --profile=black
    --line-length=88

# Remove invalid security scanning options
# Security scanning should be configured separately if needed

# Coverage settings
# Run with: pytest --cov
testpaths = apps

# Coverage thresholds
cov-fail-under = 80

# Performance testing
# Run with: pytest --benchmark
benchmark-columns = min, max, mean, stddev
benchmark-sort = mean
benchmark-warmup = on

# Remove invalid Django-specific settings

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests
    smoke: basic smoke tests
    unit: marks tests as unit tests
    migrations: tests that verify migration integrity (uses MigrationCheckingTestRunner)

# Miscellaneous
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::RuntimeWarning
