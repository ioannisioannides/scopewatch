[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = scopewatch.test_settings
python_files = tests.py test_*.py *_tests.py

# Display settings
addopts = 
    --verbose
    --color=yes
    --no-header
    --showlocals
    --strict-markers
    --tb=native
    --cov=apps
    --cov-report=term
    --cov-report=html
    --cov-report=xml
    --no-cov-on-fail

# Code formatting and linting
# Run with: pytest --black --flake8 --isort
black =
    --check
    --line-length=88
flake8-max-line-length = 88
flake8-ignore =
    E203
    W503
    E501
isort =
    --profile=black
    --line-length=88

# Security scanning
# Run with: pytest --bandit
bandit-recursive = true
bandit-exclude = tests,migrations,docs,venv,.venv

# Coverage settings
# Run with: pytest --cov
testpaths = apps

# Coverage thresholds
cov-fail-under = 80
cov-branch = True

# Performance testing
# Run with: pytest --benchmark
benchmark-columns = min, max, mean, stddev
benchmark-sort = mean
benchmark-warmup = on

# Django specific settings
django_debug_mode = true
django_find_project_apps = true

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests
    smoke: basic smoke tests
    unit: unit tests

# Miscellaneous
xvs_output = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::RuntimeWarning