name: Django CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create logs directory
      run: |
        mkdir -p logs
        
    - name: Configure SQLite
      env:
        DJANGO_SECRET_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY || 'django-insecure-test-key-for-ci' }}
        DB_ENGINE: django.db.backends.sqlite3
        DB_NAME: db.sqlite3
        DEBUG: true
      run: |
        # Create empty database file
        touch db.sqlite3
        # Optimize SQLite settings
        python optimize_sqlite.py

    - name: Fix migration dependencies
      run: |
        # Run our permanent migration fixer script
        python fix_ci_migrations.py
        
    - name: Verify fixed migrations exist 
      run: |
        # Verify that our critical migrations exist
        find apps/*/migrations -name "0002_alter_certbody_options.py" || echo "Migration not created"
        find apps/*/migrations -name "0003_certbodyuser_contact_phone.py" || echo "Migration not created"
        find apps/*/migrations -name "0010_merge_20250409_0505.py" || echo "Migration not created"
        
    - name: Run migrations
      env:
        DJANGO_SECRET_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY || 'django-insecure-test-key-for-ci' }}
        DB_ENGINE: django.db.backends.sqlite3
        DB_NAME: db.sqlite3
        DEBUG: true
      run: |
        # Run migrations
        python manage.py migrate

    - name: Run tests
      env:
        DJANGO_SECRET_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY || 'django-insecure-test-key-for-ci' }}
        DB_ENGINE: django.db.backends.sqlite3
        DB_NAME: db.sqlite3
        DEBUG: true
      run: |
        pytest --disable-warnings