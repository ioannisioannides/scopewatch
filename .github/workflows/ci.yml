name: Django CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create logs directory
      run: |
        mkdir -p logs
        mkdir -p backups

    - name: Configure SQLite
      env:
        DJANGO_SECRET_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY || 'django-insecure-test-key-for-ci' }}
        DB_ENGINE: django.db.backends.sqlite3
        DB_NAME: db.sqlite3
        DEBUG: true
      run: |
        # Create empty database file
        touch db.sqlite3
        # Optimize SQLite settings
        python scripts/utils/optimize_sqlite.py

    - name: Reset migrations for CI
      env:
        DJANGO_SECRET_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY || 'django-insecure-test-key-for-ci' }}
        DB_ENGINE: django.db.backends.sqlite3
        DB_NAME: db.sqlite3
        DEBUG: true
      run: |
        # Run our specialized CI migration fix script that handles the nonconformance model issue
        python scripts/migrations/ci_migration_fix.py

    - name: Run code quality checks
      run: |
        pip install pre-commit black isort flake8 flake8-django
        black --check --line-length=100 .
        isort --check --profile black --line-length=100 .
        flake8 --max-line-length=100 --extend-ignore=E203,W503 --exclude=*/migrations/* .

    - name: Run tests
      env:
        DJANGO_SECRET_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DJANGO_SECRET_KEY || secrets.DEV_DJANGO_SECRET_KEY || 'django-insecure-test-key-for-ci' }}
        DB_ENGINE: django.db.backends.sqlite3
        DB_NAME: db.sqlite3
        DEBUG: true
      run: |
        pytest --disable-warnings
