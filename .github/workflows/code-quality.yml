name: Code Quality

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8 flake8-django

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

      - name: Run black (check only)
        run: |
          black --check --line-length=100 .

      - name: Run isort (check only)
        run: |
          isort --check --profile black --line-length=100 .

      - name: Run flake8
        run: |
          flake8 --max-line-length=100 --extend-ignore=E203 --statistics .
