name: Scopewatch CI/CD

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}
          cache: 'pip'

      - name: Install code quality tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8 flake8-django

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit install
          pre-commit run --all-files

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality
    # Use the Development environment for all test runs to access test credentials
    environment: Development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create empty database file
        run: |
          # Create empty database file for tests
          python -c "import sqlite3; conn = sqlite3.connect('db.sqlite3'); conn.close()"
          # Optimize SQLite settings if needed
          python scripts/utils/optimize_sqlite.py

      - name: Run linting
        run: |
          pylint --rcfile=pylintrc apps scopewatch management

      - name: Run security scan
        run: |
          bandit -r apps scopewatch management -f json -o app-bandit-results.json || true
          cat app-bandit-results.json

      - name: Fix migrations for CI
        run: |
          python scripts/migrations/ci_migration_fix.py

      - name: Run tests
        env:
          # Map environment-specific variables to non-prefixed versions needed by Django
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.DEV_DEBUG }}
          ENV: "development"

          # Test credentials
          TEST_DEFAULT_USERNAME: ${{ secrets.TEST_DEFAULT_USERNAME }}
          TEST_DEFAULT_PASSWORD: ${{ secrets.TEST_DEFAULT_PASSWORD }}
          TEST_DEFAULT_EMAIL: ${{ secrets.TEST_DEFAULT_EMAIL }}
          TEST_CERTBODY_USERNAME: ${{ secrets.TEST_CERTBODY_USERNAME }}
          TEST_CERTBODY_PASSWORD: ${{ secrets.TEST_CERTBODY_PASSWORD }}
          TEST_CERTBODY_EMAIL: ${{ secrets.TEST_CERTBODY_EMAIL }}
          TEST_CERTBODY_ALT_USERNAME: ${{ secrets.TEST_CERTBODY_ALT_USERNAME }}
          TEST_CERTBODY_ALT_PASSWORD: ${{ secrets.TEST_CERTBODY_ALT_PASSWORD }}
          TEST_AUDITOR_USERNAME: ${{ secrets.TEST_AUDITOR_USERNAME }}
          TEST_AUDITOR_PASSWORD: ${{ secrets.TEST_AUDITOR_PASSWORD }}
          TEST_AUDITOR_EMAIL: ${{ secrets.TEST_AUDITOR_EMAIL }}
          TEST_UNAUTHORIZED_USERNAME: ${{ secrets.TEST_UNAUTHORIZED_USERNAME }}
          TEST_UNAUTHORIZED_PASSWORD: ${{ secrets.TEST_UNAUTHORIZED_PASSWORD }}
          TEST_API_USERNAME: ${{ secrets.TEST_API_USERNAME }}
          TEST_API_PASSWORD: ${{ secrets.TEST_API_PASSWORD }}
          TEST_API_EMAIL: ${{ secrets.TEST_API_EMAIL }}
          TEST_API_ALT_USERNAME: ${{ secrets.TEST_API_ALT_USERNAME }}
          TEST_API_ALT_PASSWORD: ${{ secrets.TEST_API_ALT_PASSWORD }}

          # Also keep prefixed versions available
          DEV_DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          DEV_DEBUG: ${{ secrets.DEV_DEBUG }}
        run: |
          pytest --xvs
          python manage.py test --settings=scopewatch.test_settings

      - name: Generate coverage report
        run: |
          pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: scopewatch:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/development'
    environment: Development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Deploy to development server
        env:
          # Map environment-specific variables to non-prefixed versions
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.DEV_DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.DEV_ALLOWED_HOSTS }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.DEV_EMAIL_HOST }}
          EMAIL_HOST_USER: ${{ secrets.DEV_EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.DEV_EMAIL_HOST_PASSWORD }}
          EMAIL_PORT: ${{ secrets.DEV_EMAIL_PORT }}
          ADMIN_USERNAME: ${{ secrets.DEV_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.DEV_ADMIN_EMAIL }}
          ENV: "development"

          # Also keep prefixed versions available
          DEV_DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          DEV_DEBUG: ${{ secrets.DEV_DEBUG }}
          DEV_ALLOWED_HOSTS: ${{ secrets.DEV_ALLOWED_HOSTS }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_EMAIL_HOST: ${{ secrets.DEV_EMAIL_HOST }}
          DEV_EMAIL_HOST_USER: ${{ secrets.DEV_EMAIL_HOST_USER }}
          DEV_EMAIL_HOST_PASSWORD: ${{ secrets.DEV_EMAIL_HOST_PASSWORD }}
          DEV_EMAIL_PORT: ${{ secrets.DEV_EMAIL_PORT }}
          DEV_ADMIN_USERNAME: ${{ secrets.DEV_ADMIN_USERNAME }}
          DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          DEV_ADMIN_EMAIL: ${{ secrets.DEV_ADMIN_EMAIL }}
        run: |
          # Run the deployment script for development environment
          bash ./deploy.sh development

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: Production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Deploy to production server
        env:
          # Map environment-specific variables to non-prefixed versions
          DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.PROD_DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.PROD_ALLOWED_HOSTS }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.PROD_EMAIL_HOST }}
          EMAIL_HOST_USER: ${{ secrets.PROD_EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.PROD_EMAIL_HOST_PASSWORD }}
          EMAIL_PORT: ${{ secrets.PROD_EMAIL_PORT }}
          DEFAULT_FROM_EMAIL: ${{ secrets.PROD_DEFAULT_FROM_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.PROD_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          ENV: "production"

          # Also keep prefixed versions available
          PROD_DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY }}
          PROD_DEBUG: ${{ secrets.PROD_DEBUG }}
          PROD_ALLOWED_HOSTS: ${{ secrets.PROD_ALLOWED_HOSTS }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_EMAIL_HOST: ${{ secrets.PROD_EMAIL_HOST }}
          PROD_EMAIL_HOST_USER: ${{ secrets.PROD_EMAIL_HOST_USER }}
          PROD_EMAIL_HOST_PASSWORD: ${{ secrets.PROD_EMAIL_HOST_PASSWORD }}
          PROD_EMAIL_PORT: ${{ secrets.PROD_EMAIL_PORT }}
          PROD_DEFAULT_FROM_EMAIL: ${{ secrets.PROD_DEFAULT_FROM_EMAIL }}
          PROD_ADMIN_USERNAME: ${{ secrets.PROD_ADMIN_USERNAME }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
        run: |
          # Run the deployment script for production environment
          bash ./deploy.sh production
